<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a2f2a" />
  <title>收桌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a2f2a;
      --bg-deep: #0f1c19;
      --ink: #f4f0e6;
      --muted: #9aab9f;
      --accent: #e8a849;
      --accent-soft: rgba(232, 168, 73, 0.18);
      --line: rgba(244, 240, 230, 0.1);
      --ok: #6ecf8a;
      --warn: #e8c049;
      --err: #e86a6a;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --serif: "DM Serif Display", "Songti SC", serif;
      --sans: "IBM Plex Sans", "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--bg-deep);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(90% 60% at 50% -15%, rgba(232, 168, 73, 0.14), transparent 55%),
        radial-gradient(50% 40% at 100% 20%, rgba(110, 207, 138, 0.08), transparent 50%),
        linear-gradient(175deg, #243d36 0%, var(--bg) 45%, var(--bg-deep) 100%);
    }

    .app {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(14px + var(--safe-top)) 18px calc(24px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Hero — brand first */
    .hero {
      text-align: center;
      padding: 8px 0 4px;
      animation: fadeUp 0.7s ease both;
    }
    .hero-brand {
      font-family: var(--serif);
      font-size: clamp(3rem, 14vw, 4.2rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--ink);
      text-shadow: 0 2px 24px rgba(232, 168, 73, 0.25);
    }
    .hero-tagline {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .stats {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      animation: fadeUp 0.7s 0.1s ease both;
    }

    .cta-row {
      display: flex;
      gap: 10px;
      animation: fadeUp 0.7s 0.15s ease both;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #f0b85c, var(--accent));
      color: #1a1a12;
      box-shadow: 0 8px 28px rgba(232, 168, 73, 0.35);
    }
    .btn-ghost {
      background: rgba(255,255,255,0.06);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .view-tabs {
      display: flex;
      gap: 6px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      padding: 4px;
    }
    .view-tab {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 10px;
      border-radius: 10px;
      font-family: var(--sans);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .view-tab.active {
      background: rgba(255,255,255,0.1);
      color: var(--ink);
    }

    .panel { display: flex; flex-direction: column; gap: 12px; flex: 1; }

    .add-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .add-bar input, .add-bar select {
      flex: 1;
      min-width: 120px;
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 0.92rem;
    }
    .add-bar input::placeholder { color: var(--muted); }
    .add-bar select { flex: 0 0 auto; max-width: 110px; }
    .add-bar .btn { flex: 0 0 auto; min-width: 64px; padding: 12px 16px; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
    }
    .suggest-item {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .suggest-item:active { background: var(--accent-soft); }

    .app-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 42vh;
      overflow-y: auto;
    }
    .app-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,0.18);
      border: 1px solid var(--line);
    }
    .app-row-main {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      cursor: pointer;
    }
    .app-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--c);
      flex-shrink: 0;
    }
    .app-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app-cat { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
    .app-row-meta { font-size: 0.72rem; color: var(--muted); }
    .icon-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 8px;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
    }
    .icon-btn.del:hover { color: var(--err); }

    /* Preview — faux home screen */
    .preview-shell {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent),
        rgba(0,0,0,0.22);
      border-radius: 24px;
      border: 1px solid var(--line);
      padding: 18px 14px 14px;
      min-height: 280px;
    }
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 10px;
      margin-bottom: 16px;
    }
    .folder-grid.animate-in .folder-cell {
      animation: slideIn 0.45s ease both;
    }
    .folder-grid.animate-in .folder-cell:nth-child(2) { animation-delay: 0.05s; }
    .folder-grid.animate-in .folder-cell:nth-child(3) { animation-delay: 0.1s; }
    .folder-grid.animate-in .folder-cell:nth-child(4) { animation-delay: 0.15s; }

    .folder-cell {
      border: none;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 4px;
      transition: transform 0.2s ease;
    }
    .folder-cell.active .folder-icon {
      box-shadow: 0 0 0 2px var(--folder-color), 0 6px 20px rgba(0,0,0,0.3);
      transform: scale(1.05);
    }
    .folder-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(0,0,0,0.2));
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .folder-label {
      font-size: 0.68rem;
      color: var(--muted);
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .folder-count {
      font-size: 0.62rem;
      color: var(--accent);
    }

    #folder-detail {
      min-height: 72px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(0,0,0,0.2);
      margin-bottom: 12px;
    }
    #folder-detail h3 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .mini-icons { display: flex; flex-wrap: wrap; gap: 8px; }
    .mini-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(145deg, #3a5248, #2a3d35);
      display: grid;
      place-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
    }

    .dock-bar {
      display: flex;
      justify-content: center;
      gap: 18px;
      padding: 12px 20px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
    }
    .dock-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(145deg, #4a6358, #324840);
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .empty { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 16px; }

    .status {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .status[data-kind="ok"] { color: var(--ok); }
    .status[data-kind="warn"] { color: var(--warn); }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .footer-actions button {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 8px;
    }

    .wearable-hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
    }
    #wearable-enable {
      border: 1px dashed var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      width: 100%;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .modal[hidden] { display: none; }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
    }
    .modal-sheet {
      position: relative;
      width: 100%;
      max-width: 440px;
      max-height: 75vh;
      background: #243832;
      border-radius: 20px 20px 0 0;
      padding: 20px 18px calc(24px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: sheetUp 0.35s ease;
    }
    .modal-sheet h2 {
      font-family: var(--serif);
      font-size: 1.4rem;
      font-weight: 400;
    }
    #plan-text {
      flex: 1;
      overflow-y: auto;
      font-size: 0.82rem;
      line-height: 1.55;
      color: var(--muted);
      white-space: pre-wrap;
      font-family: var(--sans);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(16px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @media (max-width: 280px), (max-height: 300px) {
      .hero-brand { font-size: 2rem; }
      .folder-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .folder-icon { width: 40px; height: 40px; font-size: 1rem; }
      .app-list { max-height: 28vh; }
      .hero-tagline { font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1 class="hero-brand">收桌</h1>
      <p class="hero-tagline">把乱糟糟的主屏幕，收成井井有条</p>
    </header>

    <p class="stats" id="stats">—</p>

    <div class="cta-row">
      <button type="button" class="btn btn-primary" id="organize-btn">收桌</button>
      <button type="button" class="btn btn-ghost" id="export-btn">导出方案</button>
    </div>

    <div class="view-tabs">
      <button type="button" class="view-tab active" data-view="apps">应用列表</button>
      <button type="button" class="view-tab" data-view="preview">整理预览</button>
    </div>

    <div class="panel" id="panel-apps">
      <div class="add-bar">
        <input id="app-input" type="search" placeholder="搜索或输入 App 名称" autocomplete="off" enterkeyhint="done" />
        <select id="category-override" aria-label="指定分类">
          <option value="">自动</option>
          <option value="social">社交</option>
          <option value="comm">通讯</option>
          <option value="tools">工具</option>
          <option value="productivity">效率</option>
          <option value="entertainment">娱乐</option>
          <option value="shopping">购物</option>
          <option value="finance">金融</option>
          <option value="travel">出行</option>
          <option value="health">健康</option>
          <option value="reading">阅读</option>
          <option value="photo">摄影</option>
          <option value="games">游戏</option>
          <option value="system">系统</option>
        </select>
        <button type="button" class="btn btn-ghost" id="add-app">添加</button>
      </div>
      <div class="suggestions" id="suggestions" hidden></div>
      <div class="app-list" id="app-list"></div>
    </div>

    <div class="panel" id="panel-preview" hidden>
      <div class="preview-shell">
        <div class="folder-grid" id="folder-grid"></div>
        <div id="folder-detail"></div>
        <div class="dock-bar" id="dock"></div>
      </div>
      <p class="empty" style="padding-top:0">预览为建议布局；iOS 需手动拖放完成整理</p>
    </div>

    <p class="status" id="status"></p>

    <div class="footer-actions">
      <button type="button" id="reset-btn">重置列表</button>
    </div>

    <p class="wearable-hint">戒指：摇一摇收桌 · 倾斜切换文件夹 · 手杖：轻点添加 · 摆动导出</p>
    <button type="button" id="wearable-enable">启用戒指 / 手杖传感器</button>
  </div>

  <div class="modal" id="plan-modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-sheet">
      <h2>整理方案</h2>
      <pre id="plan-text"></pre>
      <button type="button" class="btn btn-primary" id="copy-plan">复制到剪贴板</button>
      <button type="button" class="btn btn-ghost" id="close-plan">关闭</button>
    </div>
  </div>

  <script src="js/wearable-input.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
